name: Secret Scan

# Blocks a PR/push if a NEW, verified (live) secret is introduced.
# Scans only the diff — it does not walk full git history, so it will not
# fail on pre-existing historical secrets. See SECURITY.md for the runbook.

on:
  pull_request:
  push:
    branches: ['main', 'dev']

jobs:
  trufflehog:
    name: TruffleHog verified-secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified --fail
